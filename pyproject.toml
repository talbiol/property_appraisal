[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "property-appraisal"
version = "1.0.0"
description = "Flag undervalued Los Angeles listings by comparing asking prices with an XGBoost valuation built on listing, crime and income data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
]

[project.optional-dependencies]
research = ["matplotlib>=3.8", "tensorflow>=2.16"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
property_appraisal = ["web/templates/*.html", "web/static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
